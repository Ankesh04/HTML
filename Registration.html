<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <form action="">
        <fieldset>

            <legend>
                <h1>Registration Form</h1>
            </legend>

            <table border="1">

                <tr>
                    <td>
                        <label for="fullname"><b>Name</b></label>
                        <br>
                        <label for="username"><b>Username</b></label>
                        <br>
                        <label for="email"><b>Email</b></label>
                        <br>
                        <label for="password"><b>Password</b></label>
                        <br>
                        <label for="confirm-password"><b>Confirm Password</b></label>
                    </td>

                    <td>
                        <input name="fullname" placeholder="Enter Full Name" id="fullname" type="text" required>
                        <br>
                        <input name="username" placeholder="Enter Username" id="username" type="text" required>
                        <br>
                        <input name="email" id="email" placeholder="Enter your Email" type="email" required>
                        <br>
                        <input name="password" placeholder="Enter your Password" id="password" type="password" required>
                        <br>
                        <input name="confirm-password" placeholder="Enter to confirm-password" id="confirm-password"
                            type="password" required>
                    </td>
                </tr>


                <tr>
                    <td>
                        <label for="phoneno"><b>Phone Number</b></label>
                        <br>
                        <label for="dob"><b>Date of Birth</b></label>
                    </td>

                    <td>
                        <select name="countrycode">
                            <option value="+91">India +91</option>
                            <option value="+1">US +1</option>
                            <option value="+44">UK +44</option>
                            <option value="+7">Russia +7</option>
                        </select>

                        <input name="phoneno" id="phoneno" type="tel" required>

                        <br>

                        <input name="dob" id="dob" type="date" required>
                    </td>
                </tr>


                <tr>
                    <td>
                        <label><b>Gender</b></label>
                    </td>

                    <td>
                        <input name="gender" id="male" type="radio" value="male">
                        <label for="male">Male</label>

                        <input name="gender" id="female" type="radio" value="female">
                        <label for="female">Female</label>
                    </td>
                </tr>


                <tr>

                    <td>
                        <button type="submit">
                            <b>Register</b>
                        </button>
                    </td>
                </tr>

            </table>

        </fieldset>
    </form>

</body>

</html>
