<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <fieldset>
            <legend>Login form</legend>
            <div>
                <label for="userName">Enter Username</label>
                <input name="username" placeholder="Jon Dohe" id="userName" type="text">
            </div>
            <div>
                <label for="passWord">Enter Password</label>
                <input name="password" id="passWord" type="password">
            </div>

            <button>Submit</button>
        </fieldset>
        <fieldset>
            <legend>Registration form</legend>

            <div>
                <label for="tuserName">Enter Username</label>
                <input name="username" id="tuserName" type="text">
            </div>
            <div>
                <label for="tpassWord">Enter Password</label>
                <input name="password" id="tpassWord" type="password">
            </div>
            <div>
                <label for="telenumber">Enter Telephone Number</label>
                <select name="countrycode" id="c_code">
                    <option value="+91">+91</option>
                    <option value="+43">+43</option>
                    <option value="+58">+58</option>
                    <option value="+123">+123</option>
                </select>
                <input name="telliphone number" id="telenumber" type="tel">
            </div>
            <button>Register</button>
        </fieldset>
        <fieldset>
            <legend>Button type</legend>
            <input type="text" name="userName" placeholder="Enter the Name">
            <hr>
            <button>Button Default</button>
            <button type="submit">Submit Default</button>
            <button type="reset">Reset Default</button>
            <button type="button">Button</button>
        </fieldset>
        <fieldset>
            <legend>
                <h1>Type</h1>
            </legend>
            <div>
                <label for="">button</label>
                <input type="button" value="submit me">
            </div>
            <div>
                <label for="">Checkbox</label><br>
                <label for="">HTML</label>
                <input type="checkbox" name="html">
                <label for="">CSS</label>
                <input type="checkbox" name="css">
                <label for="">JS</label>
                <input type="checkbox" name="js">
            </div>
            <div>
                <label for="">Color</label>
                <input type="color">
            </div>
            <div>
                <label for="">Gender</label><br>
                <label for="">Male</label>
                <input type="radio" value="male" name="gender">
                <label for="">Female</label>
                <input type="radio" value="female" name="gender">
            </div>
            <div>
                <input type="date">
                <input type="datetime-local">
                <input type="datetime">
            </div>
            <div>
                <input type="email" placeholder="abc@gmai.com">
                <input type="number" placeholder="890129300">
                <input type="password" placeholder="Enter Password" name="passWord">
            </div>
            <div>
                <input type="file">
            </div>
            <div>
                <input type="hidden">
            </div>
            <div>
                <input type="image">
            </div>
            <div>
                <input type="month">
            </div>
            <div>
                <input type="range">
            </div>
            <div>
                <input type="search">
            </div>
            <div>
                <input type="time">
            </div>
            <div>
                <input type="url">
            </div>
            <div>
                <input type="week">
            </div>
        </fieldset>
    </form>
</body>

</html>
