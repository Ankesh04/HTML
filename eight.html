<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <fieldset>
            <legend>Login form</legend>
            <div>
                <label for="userName">Enter Username</label>
                <input name="username" id="userName" type="text">
            </div>
            <div>
                <label for="passWord">Enter Password</label>
                <input name="password" id="passWord" type="password">
            </div>

            <button>Submit</button>
        </fieldset>
        <fieldset>
            <legend>Registration form</legend>

            <div>
                <label for="tuserName">Enter Username</label>
                <input name="username" id="tuserName" type="text">
            </div>
            <div>
                <label for="tpassWord">Enter Password</label>
                <input name="password" id="tpassWord" type="password">
            </div>
            <div>
                <label for="telenumber">Enter Telephone Number</label>
                <select name="countrycode" id="c_code">
                    <option value="+91">+91</option>
                    <option value="+43">+43</option>
                    <option value="+58">+58</option>
                    <option value="+123">+123</option>
                </select>
                <input name="telliphone number" id="telenumber" type="tel">
            </div>
            <button>Register</button>
        </fieldset>
    </form>
</body>

</html>
